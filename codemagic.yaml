workflows:
  ios-simulator-build:
    name: iOS build check (no signing yet)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.1
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      # Flutter resolves SwiftPM dependencies and runs CocoaPods fallback
      # during the iOS build when required by a plugin.
      - name: Flutter analyze
        script: flutter analyze --no-fatal-infos
      - name: Build iOS (unsigned — no Apple Developer account needed)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

  ios-device-unsigned-ipa:
    name: iOS unsigned device IPA (for Sideloadly)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.1
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      # Flutter resolves SwiftPM dependencies and runs CocoaPods fallback
      # during the iOS build when required by a plugin.
      # Targets a real iPhone (iphoneos), not the Simulator — no --simulator
      # flag — and --no-codesign means no Apple Developer Program
      # membership is needed to produce this. It isn't signed, isn't
      # installable as-is, and isn't submitted anywhere; signing happens
      # later, locally, in Sideloadly with the user's own free Apple ID.
      - name: Generate iOS config and install pods
        script: flutter build ios --release --no-codesign --config-only
      - name: Build Runner.app for a real device (unsigned, full xcodebuild log)
        script: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner -configuration Release -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" build
      - name: Package Runner.app into an unsigned IPA
        script: |
          mkdir -p ipa/Payload
          cp -R build/ios_derived/Build/Products/Release-iphoneos/Runner.app ipa/Payload/
          cd ipa
          zip -r ../Listeny-Lite-unsigned.ipa Payload
    artifacts:
      - Listeny-Lite-unsigned.ipa
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

  android-apk:
    name: Android APK (universal, all devices)
    max_build_duration: 40
    instance_type: linux_x2
    environment:
      flutter: 3.47.1
      java: 17
      # Optional: set these as secure variables in Codemagic to sign with YOUR
      # key (so the APK can update over an already-installed one):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Without them a throwaway key is generated for this build: the APK
      # installs fine on a clean device, but cannot update an install that
      # was signed with a different key (uninstall first).
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Prepare signing key
        script: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$CM_BUILD_DIR/release.keystore"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "No keystore provided: generating a throwaway one"
            STORE_PASS="listeny-temp-pass"
            KEY_ALIAS="listeny"
            KEY_PASS="listeny-temp-pass"
            keytool -genkeypair -keystore "$CM_BUILD_DIR/release.keystore" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=Listeny"
          fi
          cat > android/key.properties <<PROPS
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=$CM_BUILD_DIR/release.keystore
          PROPS
      - name: Build universal release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
