name: listeny
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.3.1+4007

environment:
  sdk: ^3.13.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  # flutter_localizations + intl: generated ARB-based localization for the
  # app's own UI strings (lib/l10n/*.arb -> AppLocalizations). English is the
  # template/fallback locale; see l10n.yaml for config.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # --- Phase 2: real audio engine + background playback + system media controls ---
  # just_audio: the actual local audio decode/playback engine (play/pause/seek/queue).
  # Supports Android + iOS (also macOS/web/Linux/Windows, unused here).
  just_audio: ^0.10.6
  # audio_service: runs playback in a real background service/audio session, and
  # bridges it to the OS media UI (Android media notification + MediaSession,
  # iOS Lock Screen / Control Center / MPRemoteCommandCenter). This is what makes
  # background playback and system media controls real instead of simulated.
  # Same author as just_audio; they're designed to be used together.
  audio_service: ^0.18.19
  # audio_session: configures the real OS audio session (category "music"),
  # and exposes real interruption events (phone calls) and the real
  # "becoming noisy" event (headphones/Bluetooth unplugged) so playback reacts
  # correctly — required by just_audio/audio_service, used directly here too.
  audio_session: ^0.2.4
  # rxdart: audio_service's own handler exposes its reactive state as rxdart
  # ValueStreams; used directly (not just transitively) to combine/expose them
  # through our own PlaybackService abstraction.
  rxdart: ^0.28.0
  # file_picker: native system file picker (Files app on iOS, SAF on Android) for
  # selecting real local audio files. Used here for the minimal playback test UI.
  file_picker: ^12.1.1
  # image_picker: pick videos from the Photos/Gallery (system photo picker).
  image_picker: ^1.1.2
  # provider: lightweight dependency injection / state propagation so the UI can
  # reach the single app-wide PlaybackService instance without a heavier state
  # management framework. Supports all platforms (pure Dart + InheritedWidget).
  provider: ^6.1.5+1
  # permission_handler: requests the Android 13+ POST_NOTIFICATIONS runtime
  # permission, required for non-exempt notifications. Media-session
  # notifications — ours — are exempt from that restriction. Playback/
  # MediaSession behavior does not depend on this permission either way.
  # No-op on iOS.
  permission_handler: ^13.0.1
  # audio_metadata_reader: pure-Dart tag/artwork reader for imported files
  # (title/artist/album/track/disc/year/embedded artwork). Pure Dart means no
  # native Android/iOS plugin code — deliberately chosen after the Samsung
  # DocumentsUI crash to avoid another OEM-specific native-code failure mode
  # in the one piece of the import pipeline that touches every file.
  audio_metadata_reader: ^1.7.1
  # path_provider: locates the app's own persistent storage directory so
  # imported files can be copied in (never read from their original location).
  path_provider: ^2.1.6
  # uuid: collision-free filenames for copied audio files in app storage.
  uuid: ^4.6.0
  # path: cross-platform join/basename helpers for building app-storage paths.
  path: ^1.9.1

  # --- Phase 6: persistent library ---
  # drift: type-safe SQL database (built on sqlite3) for the real, persistent
  # song/playlist library — survives app restarts. Supports iOS + Android.
  drift: ^2.34.3
  # sqlite3: the actual native SQLite engine drift runs on. Current versions
  # bundle the native library themselves via Dart's native-assets/hooks
  # system, so no separate sqlite3_flutter_libs package is needed anymore.
  sqlite3: ^3.5.2
  # shared_preferences: small key-value storage for settings and the
  # last-known playback state (current song/position/queue/shuffle/repeat) —
  # simple scalar/blob state that doesn't need a relational schema.
  shared_preferences: ^2.5.5

  # --- Phase 11: dynamic artwork-derived color ---
  # palette_generator: extracts dominant/vibrant colors from real artwork
  # images, driving the design's signature per-track color bloom. Marked
  # "discontinued" by the Flutter team (no further updates) but the
  # extraction algorithm itself has no correctness issues and is still what
  # most Flutter apps use for this; revisit only if a real bug surfaces.
  palette_generator: ^0.3.3+7

  # package_info_plus: reads the real app version/build number from the
  # actual installed bundle for Settings > About, instead of a hardcoded
  # string that can silently drift out of sync with pubspec.yaml.
  package_info_plus: ^10.2.1

  # --- Download tab: import audio from a direct media URL ---
  # dio: streams an HTTP download straight to a file (never buffers the
  # whole body in memory) with real byte-level progress and a CancelToken
  # that actually aborts the in-flight request — the specific things
  # package:http doesn't give you without hand-rolling them.
  dio: ^5.9.0
  # ffmpeg_kit_flutter_new: extracts/transcodes audio (video -> audio-only,
  # or re-encoding to MP3). The original `ffmpeg_kit_flutter` — the package
  # every tutorial still points to — was archived by its maintainer in 2025
  # and is marked discontinued on pub.dev; this is the actively maintained
  # community fork (verified publisher, weekly-ish releases, same API
  # surface). Supports Android + iOS.
  ffmpeg_kit_flutter_new: ^4.6.2
  http: ^1.0.0

# Vendored fork of file_picker's Android backend: the upstream version always
# opens Android's document picker on the "Recent" tab with no way to change
# that. On several OEM builds (confirmed: Samsung OneUI) that tab's backing
# index can be broken/empty independent of what's actually on the device,
# making the picker look empty even with files present. The patched copy in
# third_party/android_file_picker adds one line (a standard, documented
# Android intent extra — EXTRA_INITIAL_URI) so it opens on the real internal
# storage root instead. See third_party/android_file_picker/CHANGES.md.
#
# audio_metadata_reader: upstream 1.7.1's ID3v2 text decoder always treats
# UTF-16 as little-endian, ignoring the file's actual BOM (encoding 1) and
# ignoring the spec entirely for encoding 2 (UTF-16BE, no BOM) — the root
# cause of imported tracks' Latin titles/artists/albums coming out looking
# like Chinese/Japanese mojibake. See third_party/audio_metadata_reader/
# CHANGES.md.
dependency_overrides:
  android_file_picker:
    path: third_party/android_file_picker
  audio_metadata_reader:
    path: third_party/audio_metadata_reader

dev_dependencies:
  http_parser: ^4.0.0
  flutter_test:
    sdk: flutter

  # path_provider_platform_interface: already pulled in transitively by
  # path_provider; declared directly here only so tests can fake
  # PathProviderPlatform.instance instead of needing a real platform channel
  # (unavailable under plain `flutter test`).
  path_provider_platform_interface: ^2.1.2

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # drift_dev + build_runner: generate the type-safe database code from the
  # table definitions in lib/core/storage/database.dart. Dev-only — not
  # shipped in the app.
  drift_dev: ^2.34.3
  build_runner: ^2.16.0

  # Generates every platform's launcher icon size (plus a real Android
  # adaptive icon: separate background/foreground layers so it isn't just a
  # flat square badly cropped by the OS's circle/squircle mask) from the one
  # source image in assets/icon/ — dev-only, not shipped in the app itself.
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # ARB-based localization (see l10n.yaml + lib/l10n/*.arb) generates
  # AppLocalizations into lib/l10n/generated.
  generate: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Inter, bundled locally (not fetched via google_fonts at runtime) so
  # typography stays correct with zero network dependency, matching this
  # being a fully offline app. Single variable-font file; Flutter/Skia
  # interpolates the actual weight requested at each declared step.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
          weight: 400
        - asset: assets/fonts/Inter.ttf
          weight: 500
        - asset: assets/fonts/Inter.ttf
          weight: 600
        - asset: assets/fonts/Inter.ttf
          weight: 700

# flutter_launcher_icons config — run `dart run flutter_launcher_icons` to
# (re)generate every platform icon size from these two source images.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#161826"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
